       #console {
     position: fixed;
     top: 27%;
     left: 25%;
     width: 33%;
     height: 40%;
     overflow: hidden;
     padding: 40px 12px 6px 20px;
     color: #d8d8dc;
     font: 20px/1.5 "Consolas", "DejaVu Sans Mono", monospace;
     background: transparent;
     z-index: 10;

     display: flex;
     flex-direction: column;
     align-items: flex-start;
     justify-content: flex-start;
     text-align: left;
   }

    #console * {
      text-align: left !important;
      margin-left: 0;
      margin-right: 0;
    }

    #console .log-line {
      white-space: pre-wrap;
      word-break: break-word;
      width: 100%;
    }


       #toast-container {
       position: fixed;
       top: 20px;
       right: 20px;
       z-index: 9999;
   }


   .toast {
       box-sizing: border-box;
       background: black;
       border: 2px solid yellow;
       color: #fff;
       padding: 10px 15px 10px 70px;
       border-radius: 20px;
       margin-top: 8px;
       box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
       width: 220px;
       max-width: 220px;
       min-width: 220px;
       opacity: 0.2;
       transform: translateX(100%);
